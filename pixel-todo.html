<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="pixel-todo.css">
</head>
<body>
    <audio id="bg-music" loop></audio>
    <div class="music-container">
        <h2 class="music-title">MUSIC</h2>
        <button id="prev-btn" class="nav-btn">◀</button>
        <button id="music-toggle-btn">MUSIC: OFF</button>
        <button id="next-btn" class="nav-btn">▶</button>
    </div>

    


    <div class="todo-container">
        <h1 class="todo-title">MY TO-DO LIST</h1>
        <div class="input-section">
            <input type="text" id="todo-input" placeholder="Add a new task..." autocomplete="off">
            <button id="add-btn">ADD</button>
        </div>
        
        <ul id="todo-list">
        </ul>

    </div>

    <script src="pixel-todo.js"></script>

</body>
</html>
